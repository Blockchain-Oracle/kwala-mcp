# Kwala MCP monorepo — Nixpacks build config for Coolify / Railway / Render
#
# Three deployable services. Set the APP_NAME env var per deploy so each
# service builds and runs the right workspace:
#
#   web      -> APP_NAME=@kwala-dev/web    (Next.js 16 landing + chat + explorer)
#   mcp-http -> APP_NAME=@kwala-dev/mcp    (MCP HTTP transport server, port 3001)
#   docs     -> APP_NAME=@kwala-dev/docs   (Nextra 4 documentation site)
#
# The web app connects to the MCP HTTP server via MCP_HTTP_URL env var.
# Set MCP_HTTP_URL to the internal/public URL of the mcp-http service.
#
# The CLI package is published to npm as @kwala-dev/cli and installed
# locally by users — not deployed here.
#
# IMPORTANT: In Coolify, set "Base Directory" to / (repo root), NOT
# packages/<name>. Nixpacks needs to see the workspace root so pnpm can
# resolve the monorepo. The APP_NAME filter picks the target workspace.

# -- Install phase --
# onlyIncludeFiles controls cache invalidation: nixpacks only rebuilds
# the install layer when one of these files changes.
[phases.install]
cmds = ["NODE_ENV=development pnpm install --frozen-lockfile"]
cacheDirectories = [".pnpm-store"]
onlyIncludeFiles = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "packages/web/package.json",
  "packages/docs/package.json",
  "packages/cli/package.json",
  "packages/mcp/package.json"
]

# -- Build phase --
# pnpm --filter builds only the target workspace.
[phases.build]
dependsOn = ["install"]
cmds = ["pnpm --filter ${APP_NAME:-@kwala-dev/web} build"]

# -- Start --
# web      -> next start -p $PORT
# mcp-http -> node dist/http.js (port $MCP_HTTP_PORT or 3001)
# docs     -> next start -p $PORT
[start]
cmd = "pnpm --filter ${APP_NAME:-@kwala-dev/web} start"
