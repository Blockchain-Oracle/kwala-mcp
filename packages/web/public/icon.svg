<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexagonal frame -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" stroke="#a855f7" stroke-width="1.8" fill="none"/>
  <!-- Chain link pattern (blockchain) -->
  <rect x="9" y="12" width="5" height="8" rx="2.5" stroke="#a855f7" stroke-width="1.6" fill="none"/>
  <rect x="18" y="12" width="5" height="8" rx="2.5" stroke="#a855f7" stroke-width="1.6" fill="none"/>
  <!-- Connecting bar -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#a855f7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- AI spark dots -->
  <circle cx="16" cy="7" r="1.2" fill="#c084fc"/>
  <circle cx="16" cy="25" r="1.2" fill="#c084fc"/>
</svg>
